name: Bug Report
description: Report a problem with EzImage
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian Version
      placeholder: "e.g. 1.6.5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 14.4 / Windows 11 / Ubuntu 22.04"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Storage Provider
      options:
        - Cloudflare R2
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. Include the exact error message if any.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open a note
        2. Paste an image
        3. See error "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs (if any)
      description: Open Obsidian DevTools (Ctrl+Shift+I / Cmd+Option+I) and paste any relevant errors.
      render: shell
